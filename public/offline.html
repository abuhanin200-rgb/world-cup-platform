<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#061A4D" />
  <title>التحدي - غير متصل</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#04133a;color:#fff;font-family:Tahoma,Arial,sans-serif;padding:24px}main{width:min(440px,100%);text-align:center;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:rgba(255,255,255,.05);padding:34px 24px;box-shadow:0 25px 70px rgba(0,0,0,.28)}img{width:76px;height:auto;margin-bottom:18px}h1{font-size:24px;margin:0 0 10px}p{color:rgba(255,255,255,.62);line-height:1.9;margin:0 0 22px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffc210;margin-left:6px}button{width:100%;min-height:48px;border:0;border-radius:16px;background:#ffc210;color:#04133a;font-weight:800;font-size:15px;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="/brand/altahaddi-logo-white.png" alt="التحدي" />
    <h1><span class="dot"></span>أنت غير متصل بالإنترنت</h1>
    <p>تأكد من اتصالك ثم أعد المحاولة. بمجرد عودة الشبكة ستقدر ترجع للبطولات والتوقعات والألعاب.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </main>
</body>
</html>
